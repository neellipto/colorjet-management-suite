name: Release COLORJET V17.1 Reference UI APK and AAB

on:
  push:
    branches: [build/v17-eas-20260714]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SOURCE_ZIP: COLORJET_MANAGEMENT_SUITE_V17_0_MOBILE_SOURCE.zip
  APP_VERSION: 1.7.1
  ANDROID_VERSION_CODE: '1702'
  EXPO_PROJECT_ID: affe8187-2811-4f17-9620-dbf8d542577a

jobs:
  validate:
    name: Validate original COLORJET UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish final release run ID
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'COLORJET V17.1 final corrected-branch release.'
            echo
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo 'Target: COLORJET Management Suite 1.7.1 / Android 1702 / com.colorjetbd.managementsuite'
          } > release-status.md
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'COLORJET V17.1 Final Release Status in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file release-status.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'COLORJET V17.1 Final Release Status' --body-file release-status.md
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Restore original UI over SDK 54 scaffold
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q "$SOURCE_ZIP" -d work
          node v17-build/prepare-reference-ui-source.mjs work
          node v17-build/validate-reference-ui.mjs work

      - name: Install compatible dependencies
        working-directory: work
        run: |
          set -euo pipefail
          yarn install --silent --ignore-scripts --non-interactive --no-progress --network-timeout 600000
          npx expo install --fix --yarn > ../expo-install.log 2>&1
          npx expo install --yarn @react-native-async-storage/async-storage expo-blur expo-font expo-haptics expo-image-picker expo-router expo-splash-screen expo-web-browser react-native-gesture-handler react-native-reanimated react-native-worklets react-native-safe-area-context react-native-screens react-native-svg >> ../expo-install.log 2>&1
          yarn install --silent --ignore-scripts --non-interactive --no-progress --network-timeout 600000

      - name: Validate normalized source
        run: node v17-build/validate-reference-ui.mjs work

      - name: Metro Android export
        working-directory: work
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir dist-android --clear > ../metro-export.log 2>&1 || { tail -n 180 ../metro-export.log; exit 1; }
          test -d dist-android

      - name: Package corrected source
        run: |
          set -euo pipefail
          rm -rf release-source
          mkdir release-source
          rsync -a --exclude node_modules --exclude .expo --exclude dist-android --exclude .git --exclude package-lock.json --exclude npm-shrinkwrap.json work/ release-source/
          cd release-source
          zip -qr ../COLORJET_MANAGEMENT_SUITE_V17_1_REFERENCE_UI_SOURCE_FINAL.zip .
          cd ..
          sha256sum COLORJET_MANAGEMENT_SUITE_V17_1_REFERENCE_UI_SOURCE_FINAL.zip > COLORJET_MANAGEMENT_SUITE_V17_1_REFERENCE_UI_SOURCE_FINAL.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-1-REFERENCE-UI-SOURCE-FINAL
          path: |
            COLORJET_MANAGEMENT_SUITE_V17_1_REFERENCE_UI_SOURCE_FINAL.zip
            COLORJET_MANAGEMENT_SUITE_V17_1_REFERENCE_UI_SOURCE_FINAL.zip.sha256
            work/app.json
            work/package.json
            work/yarn.lock
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-1-REFERENCE-UI-VALIDATION-LOGS
          path: |
            expo-install.log
            metro-export.log
            work/app.json
            work/package.json
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build signed ${{ matrix.kind }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: preview
            kind: APK
            filename: COLORJET_MANAGEMENT_SUITE_V17_1_REFERENCE_UI_SIGNED.apk
            artifact: COLORJET-V17-1-REFERENCE-UI-SIGNED-APK-FINAL
          - profile: production
            kind: AAB
            filename: COLORJET_MANAGEMENT_SUITE_V17_1_REFERENCE_UI_SIGNED.aab
            artifact: COLORJET-V17-1-REFERENCE-UI-SIGNED-AAB-FINAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Prepare verified UI source
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q "$SOURCE_ZIP" -d work
          node v17-build/prepare-reference-ui-source.mjs work
          node v17-build/validate-reference-ui.mjs work

      - name: Install compatible dependencies
        working-directory: work
        run: |
          set -euo pipefail
          yarn install --silent --ignore-scripts --non-interactive --no-progress --network-timeout 600000
          npx expo install --fix --yarn > ../expo-install-${{ matrix.profile }}.log 2>&1
          npx expo install --yarn @react-native-async-storage/async-storage expo-blur expo-font expo-haptics expo-image-picker expo-router expo-splash-screen expo-web-browser react-native-gesture-handler react-native-reanimated react-native-worklets react-native-safe-area-context react-native-screens react-native-svg >> ../expo-install-${{ matrix.profile }}.log 2>&1
          yarn install --silent --ignore-scripts --non-interactive --no-progress --network-timeout 600000

      - name: Validate build source
        run: node v17-build/validate-reference-ui.mjs work

      - name: Configure Android release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}
        run: bash v17-build/configure-eas-local-signing.sh work

      - name: Initialize EAS snapshot
        working-directory: work
        run: |
          git init --quiet
          git config user.name 'COLORJET Build Bot'
          git config user.email 'colorjet-build@users.noreply.github.com'
          git add -A
          git commit --quiet -m 'COLORJET V17.1 reference UI build' || true

      - name: Verify Expo project
        working-directory: work
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest project:info

      - name: Run EAS build
        working-directory: work
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if ! npx --yes eas-cli@latest build --platform android --profile '${{ matrix.profile }}' --non-interactive --wait --json > eas-${{ matrix.profile }}.json 2> eas-${{ matrix.profile }}.err; then
            cat eas-${{ matrix.profile }}.err
            cat eas-${{ matrix.profile }}.json || true
            exit 1
          fi

      - name: Download signed file
        working-directory: work
        run: |
          set -euo pipefail
          URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' eas-${{ matrix.profile }}.json)
          test -n "$URL"
          test "$URL" != null
          curl --fail --location --retry 5 "$URL" --output '${{ matrix.filename }}'
          sha256sum '${{ matrix.filename }}' > '${{ matrix.filename }}.sha256'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            work/${{ matrix.filename }}
            work/${{ matrix.filename }}.sha256
            work/eas-${{ matrix.profile }}.json
            work/app.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-1-${{ matrix.profile }}-BUILD-LOGS
          path: |
            expo-install-${{ matrix.profile }}.log
            work/eas-${{ matrix.profile }}.json
            work/eas-${{ matrix.profile }}.err
            work/app.json
            work/package.json
            work/eas.json
          if-no-files-found: warn
          retention-days: 7
