name: Build COLORJET V17.1 EAS APK and AAB

on:
  push:
    branches:
      - build/v17-eas-20260714
  workflow_dispatch:

permissions:
  contents: read

env:
  V17_BRANCH: build/v17-eas-20260714
  SOURCE_ZIP: COLORJET_MANAGEMENT_SUITE_V17_0_MOBILE_SOURCE.zip
  APP_VERSION: 1.7.1
  ANDROID_VERSION_CODE: '1702'

jobs:
  verify:
    name: Verify authoritative V17 source
    runs-on: ubuntu-latest
    steps:
      - name: Clone authoritative V17 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch "$V17_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Extract and verify V17 source
        run: |
          ls -lh "repo/$SOURCE_ZIP"
          unzip -t "repo/$SOURCE_ZIP" >/dev/null
          mkdir -p work
          unzip -q "repo/$SOURCE_ZIP" -d work
          test -f work/package.json
          test -f work/package-lock.json
          test -f work/app.json
          test -f work/eas.json
          test -f work/assets/images/colorjet-original-icon.webp
          cd work
          node scripts/check-ui-lock.mjs
          node scripts/verify-no-legacy-host.mjs
          node scripts/verify-module-registry.mjs

  eas-build:
    name: EAS ${{ matrix.profile }} V17.1
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: preview
            filename: COLORJET_MANAGEMENT_SUITE_V17_1_SIGNED.apk
          - profile: production
            filename: COLORJET_MANAGEMENT_SUITE_V17_1_SIGNED.aab
    steps:
      - name: Clone authoritative V17 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch "$V17_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Extract uploaded V17 source
        run: |
          unzip -t "repo/$SOURCE_ZIP" >/dev/null
          mkdir -p work
          unzip -q "repo/$SOURCE_ZIP" -d work

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Prepare V17.1 identity and original COLORJET assets
        working-directory: work
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sourceAsset = './assets/images/colorjet-original-icon.webp';
          const iconAsset = './assets/images/colorjet-original-icon.png';
          const pngSignature = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);

          if (!fs.existsSync(sourceAsset)) {
            throw new Error(`Missing original COLORJET asset: ${sourceAsset}`);
          }

          const bytes = fs.readFileSync(sourceAsset);
          if (!bytes.subarray(0, 8).equals(pngSignature)) {
            throw new Error('Original COLORJET logo is not PNG content. Build stopped.');
          }
          fs.copyFileSync(sourceAsset, iconAsset);

          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.name = 'COLORJET Management Suite';
          app.expo.slug = 'colorjet-management-suite';
          app.expo.version = process.env.APP_VERSION;
          app.expo.icon = iconAsset;
          app.expo.scheme = 'colorjet-erp';
          app.expo.splash = {
            ...(app.expo.splash || {}),
            image: iconAsset,
            resizeMode: 'contain',
            backgroundColor: '#1A237E'
          };
          app.expo.android = {
            ...(app.expo.android || {}),
            package: 'com.colorjetbd.managementsuite',
            versionCode: Number(process.env.ANDROID_VERSION_CODE),
            adaptiveIcon: {
              foregroundImage: iconAsset,
              backgroundColor: '#1A237E'
            }
          };
          app.expo.ios = {
            ...(app.expo.ios || {}),
            bundleIdentifier: 'com.colorjetbd.managementsuite'
          };
          app.expo.web = {
            ...(app.expo.web || {}),
            favicon: iconAsset
          };
          app.expo.plugins = (app.expo.plugins || []).map((plugin) => {
            if (Array.isArray(plugin) && plugin[0] === 'expo-splash-screen') {
              return ['expo-splash-screen', {
                ...(plugin[1] || {}),
                image: iconAsset,
                imageWidth: 180,
                resizeMode: 'contain',
                backgroundColor: '#1A237E'
              }];
            }
            return plugin;
          });
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');

          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.production.autoIncrement = false;
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');

          console.log(`Prepared ${app.expo.name} ${app.expo.version} (${app.expo.android.versionCode})`);
          console.log(`Package: ${app.expo.android.package}`);
          console.log(`Icon and adaptive icon: ${iconAsset}`);
          NODE

      - name: Install Expo dependencies with Yarn
        working-directory: work
        shell: bash
        run: |
          set +e
          yarn install --silent --ignore-scripts --non-interactive --no-progress --network-timeout 600000 > ../yarn-install.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            tail -n 60 ../yarn-install.log
            exit "$STATUS"
          fi
          test -f node_modules/expo-router/package.json
          test -f node_modules/expo/package.json
          test -f node_modules/expo-splash-screen/package.json
          test -f node_modules/expo-location/package.json
          test -f node_modules/expo-secure-store/package.json
          rm -f package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.packageManager = 'yarn@1.22.22';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          echo "Yarn dependency installation passed."

      - name: Configure Expo and original signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}
        run: bash repo/v17-build/configure-eas-local-signing.sh work

      - name: Initialize ephemeral Git repository
        working-directory: work
        shell: bash
        run: |
          git init --quiet
          git config user.name "COLORJET Build Bot"
          git config user.email "colorjet-build@users.noreply.github.com"
          git add -A
          git commit --quiet -m "COLORJET V17.1 EAS build snapshot" || true
          git status --short

      - name: Link Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        shell: bash
        run: |
          set +e
          cd work
          npx --yes eas-cli@latest project:init --force --non-interactive > ../project-init.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            tail -n 60 ../project-init.log
            exit "$STATUS"
          fi
          tail -n 10 ../project-init.log

      - name: Queue and wait for signed Android build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        working-directory: work
        shell: bash
        run: |
          set +e
          npx --yes eas-cli@latest build --platform android --profile "${{ matrix.profile }}" --non-interactive --wait --json > "eas-${{ matrix.profile }}.json" 2> "eas-${{ matrix.profile }}.err"
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "EAS build command failed for ${{ matrix.profile }}:"
            tail -n 100 "eas-${{ matrix.profile }}.err"
            test ! -s "eas-${{ matrix.profile }}.json" || tail -n 60 "eas-${{ matrix.profile }}.json"
            exit "$STATUS"
          fi

      - name: Upload EAS diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-1-${{ matrix.profile }}-EAS-DIAGNOSTICS
          path: |
            work/eas-${{ matrix.profile }}.json
            work/eas-${{ matrix.profile }}.err
            project-init.log
            work/app.json
            work/eas.json
          if-no-files-found: warn
          retention-days: 7

      - name: Download signed output
        working-directory: work
        shell: bash
        run: |
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' "eas-${{ matrix.profile }}.json")
          test -n "$BUILD_URL"
          test "$BUILD_URL" != "null"
          curl --fail --location --retry 5 "$BUILD_URL" --output "${{ matrix.filename }}"
          sha256sum "${{ matrix.filename }}" > "${{ matrix.filename }}.sha256"

      - name: Upload signed output
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-1-${{ matrix.profile }}-SIGNED
          path: |
            work/${{ matrix.filename }}
            work/${{ matrix.filename }}.sha256
            work/eas-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 14
