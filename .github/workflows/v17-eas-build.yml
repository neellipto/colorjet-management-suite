name: Build COLORJET V17 EAS APK and AAB

on:
  push:
    branches:
      - build/v17-eas-20260714
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify V17 source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v17-build/work
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract V17 source
        working-directory: .
        run: |
          rm -rf v17-build/work
          mkdir -p v17-build/work
          tar -xzf v17-build/v17-eas-source.tar.gz -C v17-build/work
      - name: Install dependencies
        run: npm install
      - name: Verify source
        run: npm run verify

  eas-build:
    name: EAS ${{ matrix.profile }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: preview
            filename: COLORJET_MANAGEMENT_SUITE_V17_0_SIGNED.apk
          - profile: production
            filename: COLORJET_MANAGEMENT_SUITE_V17_0_SIGNED.aab
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: v17-build/work
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract V17 source
        working-directory: .
        run: |
          rm -rf v17-build/work
          mkdir -p v17-build/work
          tar -xzf v17-build/v17-eas-source.tar.gz -C v17-build/work
      - name: Install dependencies
        run: npm install
      - name: Link existing Expo project
        run: npx --yes eas-cli@latest project:init --force --non-interactive
      - name: Queue and wait for signed Android build
        run: npx --yes eas-cli@latest build --platform android --profile "${{ matrix.profile }}" --non-interactive --wait --json > "eas-${{ matrix.profile }}.json"
      - name: Download signed output
        shell: bash
        run: |
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' "eas-${{ matrix.profile }}.json")
          test -n "$BUILD_URL"
          test "$BUILD_URL" != "null"
          curl --fail --location --retry 5 "$BUILD_URL" --output "${{ matrix.filename }}"
          sha256sum "${{ matrix.filename }}" > "${{ matrix.filename }}.sha256"
      - name: Upload signed output
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-${{ matrix.profile }}-SIGNED
          path: |
            v17-build/work/${{ matrix.filename }}
            v17-build/work/${{ matrix.filename }}.sha256
            v17-build/work/eas-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 14
