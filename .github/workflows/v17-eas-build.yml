name: Build COLORJET V17 EAS APK and AAB

on:
  push:
    branches:
      - build/v17-eas-20260714
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  V17_BRANCH: build/v17-eas-20260714
  SOURCE_ZIP: COLORJET_MANAGEMENT_SUITE_V17_0_MOBILE_SOURCE.zip

jobs:
  verify:
    name: Verify V17 source
    runs-on: ubuntu-latest
    steps:
      - name: Clone authoritative V17 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch "$V17_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Extract and verify V17 source
        run: |
          ls -lh "repo/$SOURCE_ZIP"
          unzip -t "repo/$SOURCE_ZIP" >/dev/null
          mkdir -p work
          unzip -q "repo/$SOURCE_ZIP" -d work
          test -f work/package.json
          test -f work/package-lock.json
          test -f work/app.json
          test -f work/eas.json
          cd work
          node scripts/check-ui-lock.mjs
          node scripts/verify-no-legacy-host.mjs
          node scripts/verify-module-registry.mjs

  eas-build:
    name: EAS ${{ matrix.profile }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: preview
            filename: COLORJET_MANAGEMENT_SUITE_V17_0_SIGNED.apk
          - profile: production
            filename: COLORJET_MANAGEMENT_SUITE_V17_0_SIGNED.aab
    steps:
      - name: Clone authoritative V17 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch "$V17_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Extract uploaded V17 source
        run: |
          unzip -t "repo/$SOURCE_ZIP" >/dev/null
          mkdir -p work
          unzip -q "repo/$SOURCE_ZIP" -d work

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install Expo dependencies with Yarn
        working-directory: work
        shell: bash
        run: |
          set +e
          yarn install --silent --ignore-scripts --non-interactive --no-progress --network-timeout 600000 > ../yarn-install.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            tail -n 60 ../yarn-install.log
            exit "$STATUS"
          fi
          test -f node_modules/expo-router/package.json
          test -f node_modules/expo/package.json
          test -f node_modules/expo-splash-screen/package.json
          test -f node_modules/expo-location/package.json
          test -f node_modules/expo-secure-store/package.json
          rm -f package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.packageManager = 'yarn@1.22.22';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          echo "Yarn dependency installation passed."

      - name: Configure Expo and original signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}
        run: bash repo/v17-build/configure-eas-local-signing.sh work

      - name: Initialize ephemeral Git repository
        working-directory: work
        shell: bash
        run: |
          git init --quiet
          git config user.name "COLORJET Build Bot"
          git config user.email "colorjet-build@users.noreply.github.com"
          git add -A
          git commit --quiet -m "COLORJET V17 EAS build snapshot" || true
          git status --short

      - name: Link or create the Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        shell: bash
        run: |
          set +e
          cd work
          npx --yes eas-cli@latest project:init --force --non-interactive > ../project-init.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            tail -n 60 ../project-init.log
            exit "$STATUS"
          fi
          tail -n 10 ../project-init.log

      - name: Queue and wait for signed Android build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        working-directory: work
        shell: bash
        run: |
          set +e
          npx --yes eas-cli@latest build --platform android --profile "${{ matrix.profile }}" --non-interactive --wait --json > "eas-${{ matrix.profile }}.json" 2> "eas-${{ matrix.profile }}.err"
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "EAS build command failed for ${{ matrix.profile }}:"
            tail -n 100 "eas-${{ matrix.profile }}.err"
            test ! -s "eas-${{ matrix.profile }}.json" || tail -n 60 "eas-${{ matrix.profile }}.json"
            exit "$STATUS"
          fi

      - name: Upload EAS diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-${{ matrix.profile }}-EAS-DIAGNOSTICS
          path: |
            work/eas-${{ matrix.profile }}.json
            work/eas-${{ matrix.profile }}.err
            project-init.log
            work/app.json
            work/eas.json
          if-no-files-found: warn
          retention-days: 7

      - name: Download signed output
        working-directory: work
        shell: bash
        run: |
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' "eas-${{ matrix.profile }}.json")
          test -n "$BUILD_URL"
          test "$BUILD_URL" != "null"
          curl --fail --location --retry 5 "$BUILD_URL" --output "${{ matrix.filename }}"
          sha256sum "${{ matrix.filename }}" > "${{ matrix.filename }}.sha256"

      - name: Upload signed output
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-${{ matrix.profile }}-SIGNED
          path: |
            work/${{ matrix.filename }}
            work/${{ matrix.filename }}.sha256
            work/eas-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 14
