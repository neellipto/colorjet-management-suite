name: Build COLORJET V17 EAS APK and AAB

on:
  push:
    branches:
      - build/v17-eas-20260714
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  V17_BRANCH: build/v17-eas-20260714
  SOURCE_ZIP: COLORJET_MANAGEMENT_SUITE_V17_0_MOBILE_SOURCE.zip

jobs:
  verify:
    name: Verify V17 source
    runs-on: ubuntu-latest
    steps:
      - name: Clone authoritative V17 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch "$V17_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Extract and verify V17 source
        run: |
          ls -lh "repo/$SOURCE_ZIP"
          unzip -t "repo/$SOURCE_ZIP" >/dev/null
          mkdir -p work
          unzip -q "repo/$SOURCE_ZIP" -d work
          test -f work/package.json
          test -f work/package-lock.json
          test -f work/app.json
          test -f work/eas.json
          cd work
          node scripts/check-ui-lock.mjs
          node scripts/verify-no-legacy-host.mjs
          node scripts/verify-module-registry.mjs

  eas-build:
    name: EAS ${{ matrix.profile }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: preview
            filename: COLORJET_MANAGEMENT_SUITE_V17_0_SIGNED.apk
          - profile: production
            filename: COLORJET_MANAGEMENT_SUITE_V17_0_SIGNED.aab
    steps:
      - name: Clone authoritative V17 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch "$V17_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Extract uploaded V17 source
        run: |
          unzip -t "repo/$SOURCE_ZIP" >/dev/null
          mkdir -p work
          unzip -q "repo/$SOURCE_ZIP" -d work

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Configure Expo and original signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}
        run: bash repo/v17-build/configure-eas-local-signing.sh work

      - name: Link or create the Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        shell: bash
        run: |
          set +e
          cd work
          npx --yes eas-cli@latest project:init --force --non-interactive > ../project-init.log 2>&1
          STATUS=$?
          cat ../project-init.log
          exit $STATUS

      - name: Queue and wait for signed Android build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        working-directory: work
        run: npx --yes eas-cli@latest build --platform android --profile "${{ matrix.profile }}" --non-interactive --wait --json > "eas-${{ matrix.profile }}.json"

      - name: Download signed output
        working-directory: work
        shell: bash
        run: |
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' "eas-${{ matrix.profile }}.json")
          test -n "$BUILD_URL"
          test "$BUILD_URL" != "null"
          curl --fail --location --retry 5 "$BUILD_URL" --output "${{ matrix.filename }}"
          sha256sum "${{ matrix.filename }}" > "${{ matrix.filename }}.sha256"

      - name: Upload signed output
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V17-${{ matrix.profile }}-SIGNED
          path: |
            work/${{ matrix.filename }}
            work/${{ matrix.filename }}.sha256
            work/eas-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 14
