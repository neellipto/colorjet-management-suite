name: Build COLORJET ERP APK

on:
  push:
    branches: [main]
    paths:
      - 'apk-wrapper/**'
      - '.github/workflows/build-colorjet-erp-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apk-wrapper/**'
      - '.github/workflows/build-colorjet-erp-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk-wrapper

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload COLORJET ERP APK
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-ERP-WebView-debug-APK
          path: apk-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
