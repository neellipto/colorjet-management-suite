name: COLORJET V17.1 Reference UI Manual Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reference-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reference UI branch
        uses: actions/checkout@v4

      - name: Verify authoritative mobile UI source
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/mobile/app/(tabs)/index.tsx
          test -f artifacts/mobile/app/login.tsx
          test -f artifacts/mobile/constants/colors.ts
          test -f artifacts/mobile/context/AppContext.tsx
          grep -q "#1A237E" artifacts/mobile/constants/colors.ts
          grep -q "#F57C00" artifacts/mobile/constants/colors.ts
          grep -q "Good morning" artifacts/mobile/app/(tabs)/index.tsx
          grep -q "Sales MTD" artifacts/mobile/app/(tabs)/index.tsx
          ! grep -R --line-number --fixed-strings "First Owner Setup" artifacts/mobile/app
          ! grep -R --line-number --fixed-strings "/deliveries/new" artifacts/mobile/app
          ! grep -R --line-number --fixed-strings "/admin/push-notifications/new" artifacts/mobile/app
          echo "Authoritative COLORJET reference UI validation passed."
