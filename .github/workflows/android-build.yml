name: Android Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Export web/PWA
        run: pnpm run build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_PASSWORD_RESET_REDIRECT: ${{ secrets.EXPO_PUBLIC_PASSWORD_RESET_REDIRECT }}
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --clean
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: artifacts/mobile/android
      - name: Generate checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: colorjet-erp-debug-apk
          path: |
            artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/mobile/checksums.sha256
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-and-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --clean
      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      - name: Build signed AAB
        working-directory: artifacts/mobile/android
        env:
          COLORJET_STORE_FILE: upload-keystore.jks
          COLORJET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COLORJET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          COLORJET_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Checksums
        run: sha256sum android/app/build/outputs/bundle/release/app-release.aab > checksums-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: colorjet-erp-release-aab
          path: |
            artifacts/mobile/android/app/build/outputs/bundle/release/app-release.aab
            artifacts/mobile/checksums-release.sha256
          if-no-files-found: error
          retention-days: 30
