name: COLORJET Android Additive CI

on:
  push:
    branches:
      - agent/final-additive-update-1721
  pull_request:
    branches:
      - agent/final-additive-update-1721
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('artifacts/mobile/app.json', 'utf8')).expo;
          if (app.android?.package !== 'com.colorjetbd.managementsuite') throw new Error('Package mismatch');
          if (app.version !== '1.7.2') throw new Error('Version mismatch');
          if (app.android?.versionCode !== 1721) throw new Error('Version code mismatch');
          if (app.extra?.eas?.projectId !== 'ea419f70-a1b3-4265-9e21-5461341ab541') throw new Error('EAS project mismatch');
          if (app.extra?.firebaseAndroidAppId !== '1:475854312836:android:c68d85ee194443660c39d1') throw new Error('Firebase app mismatch');
          console.log('COLORJET Android identity verified');
          NODE

      - name: Verify protected source
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/mobile/lib/erpApi.ts
          test -f artifacts/mobile/lib/offlineSyncQueue.ts
          test -f artifacts/mobile/app/owner-command-center.tsx
          test -f artifacts/mobile/app/owner-ai.tsx
          test -f artifacts/mobile/app/manual-registers.tsx
          test -f artifacts/mobile/app/report.tsx
          grep -q 'SecureStore' artifacts/mobile/lib/erpApi.ts
          grep -q 'Idempotency-Key' artifacts/mobile/lib/erpApi.ts
          grep -q 'permissionVersion' artifacts/mobile/context/ErpRuntimeContext.tsx
          echo 'Protected additive source verified'

      - name: Reject stale fixed reporting period
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings "2024-06" \
            artifacts/mobile/app/'(tabs)'/index.tsx \
            artifacts/mobile/app/reports.tsx \
            artifacts/mobile/app/expenses.tsx; then
            echo 'Hard-coded June 2024 reporting period is not allowed.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        working-directory: artifacts/mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript check
        working-directory: artifacts/mobile
        run: npm run typecheck
