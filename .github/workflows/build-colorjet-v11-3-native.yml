name: Build COLORJET Native Android ERP1

on:
  push:
    branches: [main]
    paths:
      - 'android-v11.3-native/**'
      - '.github/workflows/build-colorjet-v11-3-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-v11.3-native/**'
      - '.github/workflows/build-colorjet-v11-3-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v11.3-native
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/colorjet-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/colorjet-release.jks" >> "$GITHUB_ENV"
      - name: Build debug and signed release
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Verify outputs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-ERP1-SIGNED-Android
          path: |
            android-v11.3-native/app/build/outputs/apk/**/*.apk
            android-v11.3-native/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
