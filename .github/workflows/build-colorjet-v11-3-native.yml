name: Build COLORJET Native Android V11.3

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-v11.3-native/**'
      - '.github/workflows/build-colorjet-v11-3-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v11.3-native
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare production keystore when secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/colorjet-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/colorjet-release.jks" >> "$GITHUB_ENV"
            echo "Release signing credentials detected."
          else
            echo "No release keystore secret found; debug APK and unsigned release bundle will be built."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify outputs
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-ERP-Native-V11.3-Android
          path: |
            android-v11.3-native/app/build/outputs/apk/**/*.apk
            android-v11.3-native/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
