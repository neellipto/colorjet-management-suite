name: Android V13 Preview Gate

on:
  push:
    branches:
      - feature/v13-service-business-operations
    paths:
      - '.github/workflows/android-v13-preview-gate.yml'
      - 'artifacts/mobile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colorjet-v13-preview-apk
  cancel-in-progress: false

jobs:
  signed-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate protected release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for secret_name in EXPO_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing GitHub Secret: $secret_name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install workspace and EAS CLI
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          npm install --global eas-cli@latest

      - name: Validate mobile application
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Link or initialize EAS project
        working-directory: artifacts/mobile
        shell: bash
        run: |
          set -euo pipefail
          if ! eas project:info --non-interactive; then
            eas init --non-interactive --force
            eas project:info --non-interactive
          fi

      - name: Build signed preview APK
        working-directory: artifacts/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > ../../eas-preview-build.json

      - name: Download preview APK
        shell: bash
        run: |
          set -euo pipefail
          status=$(jq -r '.[0].status // empty' eas-preview-build.json)
          artifact_url=$(jq -r '.[0].artifacts.applicationArchiveUrl // empty' eas-preview-build.json)
          if [ "$status" != "FINISHED" ] || [ -z "$artifact_url" ]; then
            cat eas-preview-build.json
            exit 1
          fi
          curl --fail-with-body --location --retry 3 \
            --output COLORJET_ERP_V13_Preview.apk \
            "$artifact_url"
          sha256sum COLORJET_ERP_V13_Preview.apk \
            | tee COLORJET_ERP_V13_Preview.apk.sha256
          jq '[.[] | {
            id,
            status,
            appVersion,
            appBuildVersion,
            createdAt,
            completedAt,
            artifactUrl: .artifacts.applicationArchiveUrl
          }]' eas-preview-build.json > eas-preview-build-summary.json

      - name: Upload signed preview APK
        uses: actions/upload-artifact@v4
        with:
          name: colorjet-erp-v13-preview-apk
          path: |
            COLORJET_ERP_V13_Preview.apk
            COLORJET_ERP_V13_Preview.apk.sha256
            eas-preview-build-summary.json
          if-no-files-found: error
          retention-days: 30
