name: V13 Stacked Migration Check

on:
  pull_request:
    branches:
      - main
      - feature/v12-engineer-operations
    paths:
      - 'supabase/migrations/20260712*_v12_*.sql'
      - 'supabase/migrations/20260712*_v13_*.sql'
      - '.github/workflows/v12-migration-check.yml'
  workflow_dispatch:

jobs:
  postgres-migration-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: colorjet_v13_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d colorjet_v13_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: colorjet_v13_test

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Supabase-compatible auth and inventory objects
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text
          );
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          create table public.roles (
            id uuid primary key,
            code text not null unique
          );
          create table public.user_roles (
            user_id uuid not null references auth.users(id),
            role_id uuid not null references public.roles(id),
            primary key (user_id, role_id)
          );
          create table public.stock_balances (
            product_id uuid not null,
            warehouse_id uuid not null,
            quantity numeric(14,3) not null default 0,
            primary key (product_id, warehouse_id)
          );
          create table public.stock_movements (
            id uuid primary key default gen_random_uuid(),
            product_id uuid,
            warehouse_id uuid,
            movement_type text,
            quantity numeric(14,3),
            reference_no text,
            note text,
            created_by uuid,
            created_at timestamptz not null default timezone('utc', now())
          );
          create table public.warehouses (
            id uuid primary key default gen_random_uuid(),
            code text not null unique,
            name text not null
          );
          SQL

      - name: Apply V12 engineer operations migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712101800_v12_engineer_operations.sql

      - name: Apply V12 transactional parts migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712111000_v12_parts_request_rpc.sql

      - name: Apply V13 service, warranty and SLA migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712120000_v13_service_warranty_sla.sql

      - name: Apply V13 parts and stock migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712121000_v13_parts_stock_workflow.sql

      - name: Apply V13 reservation correction
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712121500_v13_parts_dispatch_reservation_fix.sql

      - name: Apply V13 tasks, import, HR and biometric migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712122000_v13_tasks_import_hr_biometric.sql

      - name: Verify required V12 and V13 objects
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.v12_customer_visits') is null then
              raise exception 'v12_customer_visits missing';
            end if;
            if to_regprocedure('public.v12_create_parts_request(uuid,uuid,text,text,text,timestamp with time zone,jsonb)') is null then
              raise exception 'v12_create_parts_request missing';
            end if;
            if to_regclass('public.v13_service_cases') is null then
              raise exception 'v13_service_cases missing';
            end if;
            if to_regclass('public.v13_warranty_registrations') is null then
              raise exception 'v13_warranty_registrations missing';
            end if;
            if to_regprocedure('public.v13_refresh_sla_alerts()') is null then
              raise exception 'v13_refresh_sla_alerts missing';
            end if;
            if to_regclass('public.v13_parts_reservations') is null then
              raise exception 'v13_parts_reservations missing';
            end if;
            if to_regprocedure('public.v13_create_parts_dispatch(uuid,uuid,text,uuid,text,text,text,numeric,timestamp with time zone,jsonb)') is null then
              raise exception 'v13_create_parts_dispatch missing';
            end if;
            if to_regclass('public.v13_office_tasks') is null then
              raise exception 'v13_office_tasks missing';
            end if;
            if to_regclass('public.v13_import_orders') is null then
              raise exception 'v13_import_orders missing';
            end if;
            if to_regclass('public.v13_leave_requests') is null then
              raise exception 'v13_leave_requests missing';
            end if;
            if to_regclass('public.v13_biometric_connectors') is null then
              raise exception 'v13_biometric_connectors missing';
            end if;
          end;
          $$;
          SQL
