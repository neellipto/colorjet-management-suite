name: Android EAS Release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Preview creates APK; Production creates signed AAB
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: colorjet-android-eas-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  initialize-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      BUILD_PROFILE: ${{ inputs.profile }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for secret_name in EXPO_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing GitHub Secret: $secret_name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install workspace and EAS CLI
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          npm install --global eas-cli@latest

      - name: Validate mobile application
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Link or initialize Expo EAS project
        working-directory: artifacts/mobile
        shell: bash
        run: |
          set -euo pipefail
          if eas project:info --non-interactive >/tmp/eas-project-info.txt 2>&1; then
            cat /tmp/eas-project-info.txt
          else
            echo "Existing EAS project linkage was not found. Initializing from the authenticated Expo account."
            eas init --non-interactive --force
            eas project:info --non-interactive
          fi

      - name: Build signed Android package
        working-directory: artifacts/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            --wait \
            --json > ../../eas-build.json

      - name: Validate EAS build result
        shell: bash
        run: |
          set -euo pipefail
          status=$(jq -r '.[0].status // empty' eas-build.json)
          artifact_url=$(jq -r '.[0].artifacts.applicationArchiveUrl // empty' eas-build.json)
          if [ "$status" != "FINISHED" ] || [ -z "$artifact_url" ]; then
            echo "EAS build did not finish with a downloadable application archive."
            cat eas-build.json
            exit 1
          fi

          jq '[.[] | {
            id,
            status,
            platform,
            distribution,
            buildProfile,
            appVersion,
            appBuildVersion,
            createdAt,
            completedAt,
            artifactUrl: .artifacts.applicationArchiveUrl
          }]' eas-build.json > eas-build-summary.json

          if [ "$BUILD_PROFILE" = "production" ]; then
            output="COLORJET_ERP_V13_Production.aab"
          else
            output="COLORJET_ERP_V13_Preview.apk"
          fi

          curl --fail-with-body --location --retry 3 --output "$output" "$artifact_url"
          sha256sum "$output" | tee "$output.sha256"
          echo "ANDROID_ARTIFACT=$output" >> "$GITHUB_ENV"

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: colorjet-erp-v13-${{ inputs.profile }}
          path: |
            ${{ env.ANDROID_ARTIFACT }}
            ${{ env.ANDROID_ARTIFACT }}.sha256
            eas-build-summary.json
          if-no-files-found: error
          retention-days: 30
