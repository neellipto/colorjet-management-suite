name: Production Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/mobile run typecheck 2>&1 | tee mobile-typecheck.log
      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-typecheck-report
          path: mobile-typecheck.log
          if-no-files-found: warn
      - run: pnpm --filter @workspace/mobile run build
