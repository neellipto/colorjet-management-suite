name: Build COLORJET Management Suite Original APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-managementsuite-original-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build standalone APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript validation
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Generate standalone Android project
        working-directory: artifacts/mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build debug and release outputs
        working-directory: artifacts/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Prepare production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/colorjet-release.jks"

      - name: Sign and verify release APK and AAB
        working-directory: artifacts/mobile/android
        run: |
          set -euo pipefail
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="app/build/outputs/apk/release/COLORJET-Management-Suite-v2.1.0-SIGNED.apk"
          AAB_SOURCE="app/build/outputs/bundle/release/app-release.aab"
          AAB_SIGNED="app/build/outputs/bundle/release/COLORJET-Management-Suite-v2.1.0-SIGNED.aab"
          test -f "$APK_UNSIGNED"
          test -f "$AAB_SOURCE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/colorjet-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$APK_SIGNED"
          cp "$AAB_SOURCE" "$AAB_SIGNED"
          jarsigner \
            -keystore "$RUNNER_TEMP/colorjet-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB_SIGNED" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB_SIGNED" >/dev/null

      - name: Generate checksums and build report
        working-directory: artifacts/mobile/android
        run: |
          mkdir -p release-package
          cp app/build/outputs/apk/debug/app-debug.apk release-package/COLORJET-Management-Suite-v2.1.0-DEBUG.apk
          cp app/build/outputs/apk/release/COLORJET-Management-Suite-v2.1.0-SIGNED.apk release-package/
          cp app/build/outputs/bundle/release/COLORJET-Management-Suite-v2.1.0-SIGNED.aab release-package/
          cat > release-package/BUILD_INFO.txt <<'EOF'
          COLORJET Management Suite
          Package: com.colorjetbd.managementsuite
          Version: 2.1.0
          Version Code: 3
          Build type: Standalone React Native Android application
          WebView: Not used
          Original assets: Preserved from artifacts/mobile
          EOF
          (cd release-package && sha256sum * > SHA256SUMS.txt)

      - name: Upload Android release package
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-MANAGEMENT-SUITE-ORIGINAL-V2.1-APK-AAB
          path: artifacts/mobile/android/release-package/*
          if-no-files-found: error
          retention-days: 30
