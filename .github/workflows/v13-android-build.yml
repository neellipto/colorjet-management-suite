name: V13 Android APK Build

on:
  push:
    branches:
      - feature/v13-service-business-operations
  pull_request:
    branches:
      - feature/v12-engineer-operations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v13-android-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile
      - name: Align Expo SDK 51 dependencies
        env:
          CI: "1"
        run: pnpm exec expo install --fix
      - name: Verify React Native Gradle plugin
        run: node --print "require.resolve('@react-native/gradle-plugin/package.json')"
      - name: TypeScript check
        run: pnpm run typecheck
      - name: Build production web bundle
        run: pnpm run build
      - name: Generate Android project
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform android --clean
      - name: Compile installable debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: artifacts/mobile/android
      - name: Generate checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > V13-checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: COLORJET-ERP-V13-Debug-APK
          path: |
            artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/mobile/V13-checksums.sha256
          if-no-files-found: error
          retention-days: 14
