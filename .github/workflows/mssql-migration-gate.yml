name: MSSQL Migration Gate

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      script_bundle:
        description: "Newline-separated SQL scripts to validate"
        required: true
        default: |
          database/mssql/01_schema.sql
          database/mssql/02_views.sql
          database/mssql/03_security.sql
      production_approved:
        description: "Explicitly approve production migration gate"
        required: false
        type: boolean
        default: false
      production_change_ticket:
        description: "Production change ticket/reference (required for production)"
        required: false

permissions:
  contents: read

jobs:
  staging-migration-gate:
    if: ${{ inputs.target_env == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MSSQL static preflight
        run: ./scripts/readiness/mssql_preflight.sh
      - name: Environment migration gate
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved && 'YES' || 'NO' }}
          PRODUCTION_CHANGE_TICKET: ${{ inputs.production_change_ticket }}
          SCRIPT_BUNDLE: ${{ inputs.script_bundle }}
        run: |
          mapfile -t scripts <<< "$SCRIPT_BUNDLE"
          cleaned=()
          for script in "${scripts[@]}"; do
            [[ -n "${script// }" ]] || continue
            cleaned+=("$script")
          done
          if [[ "${#cleaned[@]}" -eq 0 ]]; then
            echo "ERROR: script_bundle must contain at least one SQL file."
            exit 1
          fi
          ./scripts/readiness/mssql_migration_gate.sh "$TARGET_ENV" "${cleaned[@]}"

  production-migration-gate:
    if: ${{ inputs.target_env == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: MSSQL static preflight
        run: ./scripts/readiness/mssql_preflight.sh
      - name: Environment migration gate
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved && 'YES' || 'NO' }}
          PRODUCTION_CHANGE_TICKET: ${{ inputs.production_change_ticket }}
          SCRIPT_BUNDLE: ${{ inputs.script_bundle }}
        run: |
          mapfile -t scripts <<< "$SCRIPT_BUNDLE"
          cleaned=()
          for script in "${scripts[@]}"; do
            [[ -n "${script// }" ]] || continue
            cleaned+=("$script")
          done
          if [[ "${#cleaned[@]}" -eq 0 ]]; then
            echo "ERROR: script_bundle must contain at least one SQL file."
            exit 1
          fi
          ./scripts/readiness/mssql_migration_gate.sh "$TARGET_ENV" "${cleaned[@]}"
