name: COLORJET V17.1 EAS Error Report

on:
  push:
    branches: [build/v17-eas-20260714]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  FAILED_ARTIFACT_ID: '8389690238'
  FAILED_EAS_BUILD_ID: e2fb71fc-2568-4b77-8d0c-1619a717bd16

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Record corrected branch workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=build%2Fv17-eas-20260714&per_page=50" > branch-runs-pages.json
          jq -s '[.[].workflow_runs[]] | sort_by(.created_at) | reverse | map({id,name,event,status,conclusion,head_sha,run_number,created_at,updated_at,html_url}) | .[0:30]' branch-runs-pages.json > branch-runs.json

      - name: Download local CLI diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_ARTIFACT_ID/zip" > eas-logs.zip
          mkdir eas-logs
          unzip -q eas-logs.zip -d eas-logs
          find eas-logs -maxdepth 4 -type f -print

      - name: Query EAS build metadata and remote logs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "$FAILED_EAS_BUILD_ID" --json > eas-build-view.json 2> eas-build-view.err || true
          mkdir -p eas-remote-logs
          jq -r '.. | strings | select(test("^https://"))' eas-build-view.json 2>/dev/null | sort -u > eas-log-urls.txt || true
          index=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            index=$((index + 1))
            curl --fail --location --retry 3 "$url" -o "eas-remote-logs/log-$index.txt" || true
          done < eas-log-urls.txt
          find eas-remote-logs -type f -maxdepth 1 -print

      - name: Publish focused EAS error and run report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Automated diagnostics and corrected-branch workflow tracking for COLORJET V17.1.'
            echo
            echo '## Latest corrected-branch workflow runs'
            echo '```json'
            cat branch-runs.json
            echo '```'
            echo
            for file in eas-build-view.err eas-build-view.json eas-log-urls.txt $(find eas-logs eas-remote-logs -type f 2>/dev/null | sort); do
              [ -f "$file" ] || continue
              echo "## $file"
              echo '```text'
              tail -n 220 "$file"
              echo '```'
              echo
            done
          } > eas-error-report.md
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'COLORJET V17.1 EAS Build Error Report in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file eas-error-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'COLORJET V17.1 EAS Build Error Report' --body-file eas-error-report.md
          fi
