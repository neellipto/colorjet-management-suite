name: Build COLORJET Management Suite V3.1 Complete Merge

on:
  push:
    branches: [managementsuite-v17-merged-build]
    paths:
      - 'build-source-v17/**'
      - '.github/workflows/build-managementsuite-v17-complete.yml'
  pull_request:
    branches: [main]
    paths:
      - 'build-source-v17/**'
      - '.github/workflows/build-managementsuite-v17-complete.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.COLORJET_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.COLORJET_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: Reconstruct verified merged source
        run: |
          set -euo pipefail
          mkdir -p build/mobile
          cat build-source-v17/source.part.* | base64 --decode > "$RUNNER_TEMP/merged-v17-source.tar.gz"
          echo "06af5f6ca339af0620a88cd466ba87d4ef38baebd40ec601eb96605c79bee4cd  $RUNNER_TEMP/merged-v17-source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/merged-v17-source.tar.gz" -C build/mobile
          cp -a build-source-v17/patches/. build/mobile/
          test -f build/mobile/package.json
          test -f build/mobile/app.json
          ! grep -R --exclude-dir=node_modules --exclude-dir=android --exclude='*.md' -n "ridaa\.xyz" build/mobile

      - name: Install and validate source
        working-directory: build/mobile
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run typecheck
          CI=1 pnpm exec expo install --check
          CI=1 pnpm exec expo prebuild --platform android --clean --no-install

      - name: Fresh Gradle APK and AAB build
        working-directory: build/mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: COLORJET-V3.1-GRADLE-LOG
          path: build/mobile/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Select production or fallback signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.COLORJET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          PROD="$RUNNER_TEMP/colorjet-release.jks"
          VALID=false
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PROD" || true
            keytool -list -keystore "$PROD" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 && VALID=true || true
          fi
          if [ "$VALID" = true ]; then
            echo "SIGNING_KEYSTORE=$PROD" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            KS="$RUNNER_TEMP/colorjet-v31-fallback.jks"
            PASS="$(openssl rand -hex 24)"
            ALIAS='colorjet-management-suite-v31'
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=COLORJET Bangladesh, OU=Mobile Apps, O=COLORJET Bangladesh, L=Dhaka, ST=Dhaka, C=BD'
            echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=ephemeral-fallback" >> "$GITHUB_ENV"
          fi

      - name: Sign, verify and package release
        working-directory: build/mobile
        run: |
          set -euo pipefail
          APK_SOURCE="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*SIGNED*' | head -1)"
          AAB_SOURCE="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' ! -name '*SIGNED*' | head -1)"
          mkdir -p release-package
          APK="release-package/COLORJET-Management-Suite-v3.1.0-MERGED-SIGNED.apk"
          AAB="release-package/COLORJET-Management-Suite-v3.1.0-MERGED-SIGNED.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$SIGNING_KEYSTORE" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "pass:$SIGNING_STORE_PASSWORD" --key-pass "pass:$SIGNING_KEY_PASSWORD" --out "$APK" "$APK_SOURCE"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-package/APK_SIGNATURE.txt
          cp "$AAB_SOURCE" "$AAB"
          jarsigner -keystore "$SIGNING_KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" "$AAB" "$SIGNING_ALIAS"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          zip -qr release-package/COLORJET-MANAGEMENT-SUITE-V3.1-MERGED-SOURCE.zip . -x 'node_modules/*' 'android/*' '.expo/*' 'release-package/*'
          cat > release-package/BUILD_INFO.txt <<EOF
          COLORJET Management Suite V3.1.0
          Package: com.colorjetbd.managementsuite
          Version Code: 3100
          Source: Fresh V16 UI + V3 cPanel API/security merge
          Module definitions: 53
          Specialized screens: Attendance, Visits, RMA, Shipments, Ledger
          Other modules: cPanel list/create contracts
          Reused old APK: No
          Hardcoded Replit endpoint: No
          Employee image seed: Removed
          WebView: No
          TypeScript: Passed
          Expo dependency check: Passed
          Android prebuild: Fresh
          APK/AAB Gradle build: Passed
          Signing mode: $SIGNING_MODE
          Live cPanel runtime: Not tested in CI
          Physical Android device: Not tested in CI
          EOF
          (cd release-package && sha256sum COLORJET-* APK_SIGNATURE.txt BUILD_INFO.txt > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: COLORJET-MANAGEMENT-SUITE-V3.1-MERGED-APK-AAB-SOURCE
          path: build/mobile/release-package/*
          if-no-files-found: error
          retention-days: 30
